apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Kustomization SOLO del backend (usada por base/, que a su vez usan los overlays).
# NOTA: la Application de Argo CD (argocd/app-stack.yaml) ya no apunta aqui
# directamente; apunta a overlays/local u overlays/server, que incluyen esta
# capa junto con las demas.
resources:
  - codigo-backend.yaml
  - pvc-backend.yaml
  - cms-uploads-pvc.yaml
  - deploy-backend.yaml