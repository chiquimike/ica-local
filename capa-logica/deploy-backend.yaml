apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-api
  template:
    metadata:
      labels:
        app: backend-api
    spec:
      # Espera a que MySQL responda ANTES de arrancar el backend.
      # Sin esto, el backend arrancaba en paralelo con MySQL y su migracion de
      # inicio (que reintenta 10 veces x 3s = 30s) podia agotarse en hardware
      # lento; el pod quedaba "Running" pero sin tablas, fallando en silencio.
      # Usa la misma imagen mysql:5.7 del StatefulSet: ya esta en el nodo, no
      # descarga nada nuevo (relevante con 2GB de RAM).
      initContainers:
      - name: esperar-mysql
        image: mysql:5.7
        env:
        # mysqladmin lee MYSQL_PWD del entorno: evita poner la password en la
        # linea de comandos (donde seria visible con 'ps').
        - name: MYSQL_PWD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: mysql-root-password
        command:
        - sh
        - -c
        - |
          intentos=60
          i=0
          until mysqladmin ping -h mysql-nodeport -u root --silent; do
            i=$((i+1))
            if [ "$i" -ge "$intentos" ]; then
              echo "MySQL no respondio tras $intentos intentos (120s). Abortando."
              exit 1
            fi
            echo "Esperando a MySQL... ($i/$intentos)"
            sleep 2
          done
          echo "MySQL responde y las credenciales son validas. Arrancando backend."
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "64Mi"
            cpu: "100m"
      containers:
      - name: fastapi
        image: python:3.9-alpine
        workingDir: /app
        command: ["/bin/sh", "-c", "pip install --no-cache-dir -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 80"]
        ports:
        - containerPort: 80
        env:
        - name: DB_HOST
          value: "mysql-nodeport"
        # La contraseña se inyecta desde el Secret, no se quema en el código
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: mysql-root-password
        # Correos admin que pueden entrar aunque no sean @aragon.unam.mx (separados por coma)
        # Ej: "tucorreo@gmail.com,otroadmin@gmail.com"
        - name: CORREOS_ADMIN
          value: "miguelfuster47@aragon.unam.mx"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "300m"
        volumeMounts:
        - name: codigo-vol
          mountPath: /app/main.py
          subPath: main.py
        - name: codigo-vol
          mountPath: /app/requirements.txt
          subPath: requirements.txt
        # El disco duro persistente para PDFs
        # Si hacemos un "kubectl delete -k ." VA A BORRAR LOS PDF 
        # Ahorita que estamos en "Desarrollo" no hay problema pero ya en Produccion
        # Esta wea no hay que borrarla
        - name: pdf-storage
          mountPath: /app/pdfs
        # Imagenes subidas desde el CMS
        - name: cms-uploads
          mountPath: /app/uploads
      volumes:
      - name: codigo-vol
        configMap:
          name: backend-codigo
      - name: pdf-storage
        persistentVolumeClaim:
          claimName: backend-pdf-pvc
      - name: cms-uploads
        persistentVolumeClaim:
          claimName: cms-uploads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: svc-backend
spec:
  type: NodePort
  selector:
    app: backend-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30090