# SealedSecret de MySQL para el SERVIDOR (produccion, K3s / HP ProLiant).
#
# Este es un TEMPLATE. El campo encryptedData de abajo NO es un secreto real
# cifrado: es un marcador de posicion. Si intentas aplicarlo tal cual, el
# controlador de Sealed Secrets fallara al descifrarlo y el Secret real
# "mysql-secret" simplemente no se creara (falla de forma segura, no expone
# nada) — eso es intencional mientras no generemos el valor real.
#
# COMO GENERAR EL VALOR REAL (en el servidor, la primera vez):
#   1. Instalar el controlador (una sola vez, namespace kube-system):
#      kubectl apply -f https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.38.4/controller.yaml
#   2. Instalar el CLI kubeseal en el servidor:
#      wget https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.38.4/kubeseal-0.38.4-linux-amd64.tar.gz
#      tar -xzf kubeseal-0.38.4-linux-amd64.tar.gz kubeseal
#      sudo install -m 755 kubeseal /usr/local/bin/kubeseal
#   3. Generar el archivo cifrado a partir de una contrasena NUEVA (no reuses
#      "1ca_01": esa quedo expuesta en el historial de git y hay que darla
#      por comprometida):
#      kubectl create secret generic mysql-secret \
#        --namespace default \
#        --from-literal=mysql-root-password='<TU-CONTRASENA-NUEVA-Y-FUERTE>' \
#        --dry-run=client -o yaml | \
#        kubeseal --format yaml > overlays/server/mysql-secret-sealed.yaml
#   4. Ese comando SOBREESCRIBE este archivo con el cifrado real. Verifica que
#      diga "encryptedData" con un valor largo en base64 (no el texto de abajo)
#      y haz commit de ESE archivo (el cifrado SI es seguro de subir a un repo
#      publico: solo el controlador dentro del cluster puede descifrarlo).
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: mysql-secret
  namespace: default
spec:
  encryptedData:
    mysql-root-password: REEMPLAZA_ESTO_CON_LA_SALIDA_REAL_DE_KUBESEAL_PASO_3 #Ojito aqui con la contraseña
  template:
    metadata:
      name: mysql-secret
      namespace: default
    type: Opaque
