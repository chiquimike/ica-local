# Secret de MySQL SOLO para desarrollo local (Minikube).
#
# Este valor es intencionalmente una contrasena de relleno, sin valor real que
# proteger: la base de datos de Minikube no contiene informacion real de
# alumnos y el cluster no es accesible fuera de la maquina de quien desarrolla.
#
# NUNCA reutilices este valor para el servidor de produccion. El overlay de
# servidor (overlays/server) NO usa este archivo: usa un SealedSecret cifrado
# (ver overlays/server/mysql-secret-sealed.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
type: Opaque
stringData:
  mysql-root-password: "dev-local-solo-minikube"
