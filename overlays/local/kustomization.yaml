apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Entorno LOCAL (Minikube). Usa la base (el config.js por defecto ya apunta a
# Minikube, no hay que cambiar nada) y agrega el Secret de MySQL de desarrollo
# (ver mysql-secret-dev.yaml: valor de relleno, nunca usar en el servidor).
resources:
  - ../../base
  - mysql-secret-dev.yaml
